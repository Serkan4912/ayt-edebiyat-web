<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYT Edebiyat</title>
<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --accent:#38bdf8;
  --accent2:#22d3ee;
  --text:#e5e7eb;
}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:linear-gradient(180deg,#020617,#0b1220);
  color:var(--text);
}
header{
  padding:22px;
  text-align:center;
  font-size:26px;
  font-weight:800;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#020617;
}
.container{
  padding:18px;
  animation:fade .4s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  margin:14px auto;
  max-width:520px;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}
button{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:17px;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#020617;
  transition:.15s;
}
button:active{ transform:scale(.96); }
.back{ background:#94a3b8 !important; margin-bottom:16px; }
h2{
  text-align:center;
  margin:10px 0 20px;
  font-size:22px;
}
ul{ padding:0; }
li{
  list-style:none;
  background:#020617;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  box-shadow: inset 0 0 0 1px #1e293b;
}
</style>
</head>
<body>

<header>AYT Edebiyat</header>
<div class="container" id="app"></div>

<script>
const app = document.getElementById("app");
let stack = [];
let allData = {
  "Geçiş Dönemi":{
    "Yusuf Has Hacip":["Kutadgu Bilig"],
    "Kaşgarlı Mahmut":["Divânü Lügâti’t-Türk"],
    "Edip Ahmet Yüknekî":["Atabetü’l-Hakâyık"],
    "Hoca Ahmet Yesevî":["Divân-ı Hikmet"]
  },
  "Divan Edebiyatı":{
    "Hoca Dehhânî":["Selçuklu Şehnâmesi"],
    "Mevlânâ":["Divan-Kebir","Mesnevi","Fihi Mafih","Mektubat","Mecalis-i Seba"],
    "Ahmet Faki":["Çarhname"],
    "Şeyyad Hamza":["Yusuf u Züleyha"],
    "Sultan Veled":["Divan","İbtidaname","Rebabapname","İntihaname"],
    "Âşık Paşa":["Garipname"],
    "Ahmedî":["İskendername","Cemşid ü Hurşid"],
    "Gülşehrî":["Mantuku't Tayt","Felekname"],
    "Ali Şir Nevâî":["Muhakemetü'l Lügateyn","Mecalisü'n Nefais"],
    "Şeyhî":["Hüsrev ü Şirin","Harnâme"],
    "Ahmed-i Dâî":["Çenknâme"],
    "Fuzûli":["Leyla vü Mecnun","Beng ü Bade","Sakiname","Rind ü Zahid","Şikâyetnâme"],
    "Taşlıcalı Yahyâ":["Yusuf u Züleyha","Şah u Geda"],
    "Nâbî":["Hayriyye","Hayrabad","Surnâme"],
    "Şeyh Gali":["Hüsn ü Aşk"]
  },
  "Tanzimat Dönemi":{
    "1. Dönem":{
      "Şemsettin Sami":["Taaşuk-ı Talat ve Fitnat"],
      "Ahmet Mithat Efendi":["Hüseyin Fellâh","Esrâr-ı Cinâyât","Esâret","Letâif-i Rivayat","Eflatun Bey ile Râkım Efendi"],
      "Namık Kemal":["İntibah","Cezmi","Vatan Yahut Silistre","Gülnihal","Lisân-ı Osmânî"],
      "Ziya Paşa":["Zafernâme","Harâbât","Defter-i Âmâl","Eş'ar-ı Ziya"],
      "İbrahim Şinasi":["Tercüman-ı Ahval","Tercüman-ı Ahval Mukaddimesi","Tasvir-i Efkâr","Tercüme-i Manzume"]
    },
    "2. Dönem":{
      "Sami Paşazade Sezai":["Küçük Şeyler","Sergüzeşt","Rumuzu'l-Edeb","İclâl"],
      "Abdülhak Hamit Tarhan":["Sahra","Makber","Ölü","Bâlâdan Bir Ses","Validem"],
      "Recaizade Mahmut Ekrem":["Araba Sevdası"],
      "Muallim Naci":["Ateşpâre","Demdeme"],
      "Nabizade Nazım":["Karabibik","Zehra","Yadigarlarım"]
    }
  }
};

function render(html){ app.innerHTML = html; }

function go(view){ stack.push(app.innerHTML); render(view); }

function back(){ if(stack.length) render(stack.pop()); }

function ana(){
  stack=[];
  render(`
    <div class="card"><button onclick="gecis()">Geçiş Dönemi</button></div>
    <div class="card"><button onclick="divan()">Divan Edebiyatı</button></div>
    <div class="card"><button onclick="tanzimat()">Tanzimat Dönemi</button></div>
  `);
}

function gecis(){ go(renderYazar("Geçiş Dönemi")); }
function divan(){ go(renderYazar("Divan Edebiyatı")); }
function tanzimat(){ go(renderYazar("Tanzimat Dönemi")); }

function renderYazar(donem){
  let html = `<div class="card"><button class="back" onclick="back()">⬅ Geri</button></div>`;
  if(donem==="Tanzimat Dönemi"){
    Object.keys(allData[donem]).forEach(d=>{
      html+=`<h2 style="text-align:center;">${d}</h2>`;
      Object.keys(allData[donem][d]).forEach(yazar=>{
        html+=`<div class="card"><button onclick="eser('${yazar}','${donem}','${d}')">${yazar}</button></div>`;
      });
    });
  } else {
    Object.keys(allData[donem]).forEach(yazar=>{
      html+=`<div class="card"><button onclick="eser('${yazar}','${donem}')">${yazar}</button></div>`;
    });
  }
  return html;
}

function eser(yazar, donem, altD=null){
  let liste = altD ? allData[donem][altD][yazar] : allData[donem][yazar];
  let li = liste.map(e=>`<li>${e}</li>`).join("");
  go(`
    <div class="card"><button class="back" onclick="back()">⬅ Geri</button></div>
    <h2>${yazar}</h2>
    <ul>${li}</ul>
  `);
}

ana();
</script>

</body>
</html>
