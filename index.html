<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>AYT Edebiyat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --accent:#38bdf8;
  --accent2:#22d3ee;
  --text:#e5e7eb;
}
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:linear-gradient(180deg,#020617,#0b1220);
  color:var(--text);
}
header{
  padding:22px;
  text-align:center;
  font-size:26px;
  font-weight:800;
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#020617;
}
.container{
  padding:18px;
  animation:fade .4s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  margin:14px auto;
  max-width:520px;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}
button{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:17px;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#020617;
  transition:.15s;
}
button:active{ transform:scale(.96); }
.back{
  background:#94a3b8 !important;
}
h2{
  text-align:center;
  margin:10px 0 20px;
  font-size:22px;
}
ul{ padding:0; }
li{
  list-style:none;
  background:#020617;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  box-shadow: inset 0 0 0 1px #1e293b;
}
</style>
</head>

<body>

<header>AYT Edebiyat</header>
<div class="container" id="app"></div>

<script>
const app = document.getElementById("app");
let stack = [];

function render(html){
  app.innerHTML = html;
}

function go(view){
  stack.push(app.innerHTML);
  render(view);
}

function back(){
  render(stack.pop());
}

function ana(){
  stack=[];
  render(`
    <div class="card"><button onclick="gecis()">Geçiş Dönemi</button></div>
    <div class="card"><button onclick="divan()">Divan Edebiyatı</button></div>
    <div class="card"><button onclick="tanzimat()">Tanzimat Dönemi</button></div>
  `);
}

function gecis(){
  go(`
    <h2>Geçiş Dönemi</h2>
    <div class="card"><button onclick="eser('Yusuf Has Hacip',['Kutadgu Bilig'])">Yusuf Has Hacip</button></div>
    <div class="card"><button onclick="eser('Kaşgarlı Mahmut',['Divânü Lügâti’t-Türk'])">Kaşgarlı Mahmut</button></div>
    <div class="card"><button onclick="eser('Edip Ahmet Yüknekî',['Atabetü’l-Hakâyık'])">Edip Ahmet Yüknekî</button></div>
    <div class="card"><button onclick="eser('Hoca Ahmet Yesevî',['Divân-ı Hikmet'])">Hoca Ahmet Yesevî</button></div>
    <div class="card"><button class="back" onclick="back()">⬅ Geri</button></div>
  `);
}

function divan(){
  go(`
    <h2>Divan Edebiyatı</h2>
    <div class="card"><button onclick="eser('Fuzûlî',['Leyla vü Mecnun','Beng ü Bade','Sakinâme','Rind ü Zahid','Şikâyetnâme'])">Fuzûlî</button></div>
    <div class="card"><button onclick="eser('Nâbî',['Hayriyye','Hayrâbâd','Surnâme'])">Nâbî</button></div>
    <div class="card"><button onclick="eser('Şeyh Galip',['Hüsn ü Aşk'])">Şeyh Galip</button></div>
    <div class="card"><button onclick="eser('Ali Şir Nevâî',['Muhakemetü’l Lügateyn','Mecalisü’n Nefais'])">Ali Şir Nevâî</button></div>
    <div class="card"><button class="back" onclick="back()">⬅ Geri</button></div>
  `);
}

function tanzimat(){
  go(`
    <h2>Tanzimat Dönemi</h2>
    <div class="card"><button onclick="eser('Namık Kemal',['İntibah','Cezmi','Vatan Yahut Silistre','Gülnihal','Lisân-ı Osmânî'])">Namık Kemal</button></div>
    <div class="card"><button onclick="eser('Ahmet Mithat Efendi',['Hüseyin Fellâh','Esrâr-ı Cinâyât','Esâret','Letâif-i Rivayat','Felâtun Bey ile Râkım Efendi'])">Ahmet Mithat Efendi</button></div>
    <div class="card"><button onclick="eser('Şinasi',['Tercüman-ı Ahvâl','Tasvir-i Efkâr','Tercüme-i Manzume'])">Şinasi</button></div>
    <div class="card"><button class="back" onclick="back()">⬅ Geri</button></div>
  `);
}

function eser(yazar, liste){
  let li = liste.map(e=>`<li>${e}</li>`).join("");
  go(`
    <h2>${yazar}</h2>
    <ul>${li}</ul>
    <div class="card"><button class="back" onclick="back()">⬅ Geri</button></div>
  `);
}

ana();
</script>

</body>
</html>
